<!doctype html>
<html lang="th">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#f7f5ef">
	<title>สถานที่ท่องเที่ยว</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
	<style>
		:root {
			--black: #030303;
			--gray: #69746d;
			--white: #f7f5ef;
			--green: #1abb05;
            --orange: #ee9105;
            --blue: #0a7bee;
            --brown: #a0522d;
			--line: #deded5;
		}
		* { box-sizing: border-box; }
		html { scroll-behavior: smooth; }
		body {
			margin: 0;
			font-family: "Noto Sans Thai", "DM Sans", sans-serif;
		}

		.page-header {
			max-width: 1380px;
			margin: 0 auto;
			padding: clamp(16px, 3vw, 30px) clamp(16px, 7.2vw, 100px);
			display: flex;
			align-items: center;
			justify-content: center;
			flex-wrap: wrap;
			gap: clamp(10px, 2vw, 24px);
		}
		.trip-name {
			margin: 0;
			color: var(--black);
			font: 700 clamp(12px, 1.5vw, 20px) "DM Sans", sans-serif;
			white-space: nowrap;
		}
		.trip-name span { color: var(--orange); }
		.page-title {
			flex: 1 1 260px;
			min-width: 0;
			margin: 0;
			text-align: right;
			font-size: clamp(17px, 3.2vw, 38px);
			font-weight: 700;
			line-height: 1.35;
			color: var(--orange);
			white-space: normal;
		}
		.feature {
			position: relative;
			width: calc(100% - clamp(32px, 7.2vw, 100px));
			max-width: 1200px;
			aspect-ratio: 1.9;
			margin: 0 auto;
			overflow: hidden;
			background: #899b89;
		}
		.feature-link { position: absolute; inset: 0; overflow: hidden; }
		.feature img, .card-image img { width: 100%; height: 100%; display: block; object-fit: cover; }
		.feature img { object-fit: contain; }
		.feature img { object-position: center 53%; transition: transform 700ms cubic-bezier(.2,.7,.2,1), filter 350ms ease; }
		.feature-link:hover img { transform: scale(1.045); filter: saturate(1.08); }
		.feature-link:active img { transform: scale(.985); }
		

		.collection {
			max-width: 1380px;
			margin: 0 auto;
			padding: clamp(44px, 5.3vw, 72px) clamp(18px, 7.2vw, 100px) clamp(52px, 6.4vw, 88px);
		}
		.section-heading {
			display: flex;
			justify-content: center;
			align-items: center;
			gap: 20px;
			padding-bottom: 22px;
			border-bottom: 1px solid var(--line);
		}
		.section-heading h2 {
			position: relative;
			isolation: isolate;
			margin: 0;
			font-size: clamp(28px, 3vw, 40px);
			font-weight: 700;
			line-height: 1.4;
		}
		.section-heading h2 span { color: var(--green); }
		.section-heading p { margin: 0; color: var(--gray); font-size: 12px; }
		.gallery {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr));
			gap: clamp(20px, 2.5vw, 34px) clamp(14px, 1.6vw, 22px);
			padding-top: clamp(20px, 2vw, 28px);
		}
		.travel-card { min-width: 0; animation: arrive 500ms both; }
		.travel-card:nth-child(n+2) { animation-delay: 60ms; }
		.gallery-divider {
			grid-column: 1 / -1;
			margin: 20px 0 4px;
			color: var(--blue);
			text-align: center;
			font-size: clamp(26px, 3vw, 38px);
        }
        .gallery-divider1 {
			grid-column: 1 / -1;
			margin: 20px 0 4px;
			color: var(--brown);
			text-align: center;
			font-size: clamp(26px, 3vw, 38px);
		}
		.travel-card h3 {
			margin: 14px 0 0;
			color: var(--black);
			font-size: clamp(18px, 2vw, 24px);
			font-weight: 700;
			line-height: 1.4;
			text-align: center;
		}
		.card-image {
			position: relative;
			display: block;
			aspect-ratio: 1.34;
			overflow: hidden;
			background: #d8d8cb;
			text-decoration: none;
		}
		.card-image img { transition: transform 500ms cubic-bezier(.2,.7,.2,1), filter 250ms ease; }
		.card-image:hover img { transform: scale(1.06); filter: brightness(.88); }
		.card-image:active img { transform: scale(.98); }
		.card-image::after {
			position: absolute;
			inset: 0;
			display: grid;
			place-items: center;
			color: rgb(245, 242, 242);
			content: "ดูรายละเอียด  ↗";
			font-size: 20px;
			font-weight: 600;
			opacity: 0;
			transform: translateY(10px);
			transition: opacity 300ms ease, transform 300ms ease;

		}
		.card-image:hover::after,
		.card-image:focus-visible::after { opacity: 1; transform: translateY(0); }
		.map-link, .zone-nav a {
			display: block;
			width: fit-content;
			padding: 9px 16px;
			border-radius: 25px;
			background: linear-gradient(110deg, #ff514f, #e91e63);
			box-shadow: 0 5px 15px rgba(233, 30, 99, .28);
			color: white;
			font-size: 16px;
			font-weight: 700;
			text-decoration: none;
			white-space: nowrap;
			transition: transform 180ms ease, box-shadow 180ms ease;
		}
		.map-link { margin: 10px auto 0; }
		.zone-nav { display: flex; flex-wrap: wrap; justify-content: center; gap: clamp(12px, 2.5vw, 16px); }
		.map-link:hover, .zone-nav a:hover {
			transform: translateY(-2px);
			box-shadow: 0 8px 20px rgba(233, 30, 99, .42);
		}


	</style>

		const gallery = document.querySelector('#gallery');

    function makeCard(photo, url, title, destination) {

        const card = document.createElement('article');
        card.className = 'travel-card';

        // สร้างโครงสร้างการ์ด
        card.innerHTML = `
            <a class="card-image" href="${url}" target="_blank" rel="noopener noreferrer">
                <img loading="lazy">
            </a>

            <h3>${title}</h3>

            <a class="map-link"
               href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(destination)}"
               target="_blank"
               rel="noopener noreferrer">
                📍 ดูเส้นทาง
            </a>
        `;

    
        const image = card.querySelector('img');

        image.src = photo;
        image.alt = title;

        return card;
    }

		places.forEach(([photo, url, title, destination], index) => {
